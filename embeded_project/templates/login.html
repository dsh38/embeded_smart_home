{% extends 'base.html' %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>스마트홈 시스템 로그인</h2>
            <p>보안 접속을 위해 계정 정보를 입력하세요</p>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="username"><i class="fa-solid fa-user-shield"></i> 사용자 아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디 입력" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="password"><i class="fa-solid fa-key"></i> 비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="btn-toggle-eye">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember" name="remember">
                    <span class="checkmark"></span>
                    자동 로그인 (로그인 유지)
                </label>
            </div>
            
            <div id="error-message" class="alert-box error-alert hidden">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span class="alert-text">오류 메시지</span>
            </div>

            <button type="submit" class="btn-primary btn-block">
                <span class="btn-text">로그인</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
